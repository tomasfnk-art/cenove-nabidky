<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cenové nabídky</title>
<style>
:root{--bg:#f4f5f7;--fg:#1c1e21;--card:#fff;--bd:#d9dce1;--ac:#2563eb;--mu:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#e8e9eb;--card:#1f2226;--bd:#33373d;--ac:#4f86f7;--mu:#9aa0a8}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#e8e9eb;--card:#1f2226;--bd:#33373d;--ac:#4f86f7;--mu:#9aa0a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
small,.mu{color:var(--mu)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
.tabs button{white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:12px}
input,select,textarea{font:inherit;font-size:16px;min-height:48px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);width:100%}
button{font:inherit;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 4px}
.f{display:block;margin-bottom:10px}
.f input,.f textarea{margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0}
.card .row+.row,.card h3+.row{border-top:1px solid var(--bd)}
.nm{flex:1 1 100%}
.sm{flex:0 0 100px;width:100px}
.row select{flex:0 0 130px;width:130px}
.ck{display:flex;align-items:center;gap:6px}
.ck input{width:22px;min-height:22px}
.pr{margin-left:auto;min-width:90px;text-align:right}
.x{width:44px;padding:0}
.big{font-size:20px;font-weight:700;margin:4px 0}
.ln{display:flex;justify-content:space-between;padding:4px 0}
.ln.t{border-top:2px solid var(--fg);margin-top:6px;padding-top:8px;font-size:20px}
.navb{display:flex;justify-content:space-between;margin-top:8px}
.sw{overflow-x:auto;padding:8px 0}
#sheet{background:#fff;color:#111;width:210mm;min-height:297mm;margin:0 auto;padding:18mm;font:11pt/1.4 system-ui,sans-serif}
#sheet table{width:100%;border-collapse:collapse}
#sheet td{padding:4px 0;border-bottom:1px solid #e5e7eb}
#sheet .r{text-align:right;white-space:nowrap}
#sheet .s td{font-weight:700;border-bottom:2px solid #111}
#sheet h1{margin:0 0 6px;font-size:20pt}
#sheet h3{margin:16px 0 4px}
#sheet .cat{break-inside:avoid}
#sheet .tot td{font-size:14pt;font-weight:700;border-bottom:0;padding-top:10px}
@media(min-width:720px){.nm{flex:1 1 220px}}
@media print{.np{display:none!important}body{background:#fff}body::before{display:none}main{padding:0;max-width:none}.sw{padding:0;overflow:visible}#sheet{width:auto;min-height:0;padding:0}@page{size:A4;margin:15mm}}

html,body{max-width:100%;overflow-x:clip}
header>div{min-width:0;overflow-wrap:anywhere}
header>div:last-child{flex-shrink:0}
main,.card,.row,.f{min-width:0}
input,select,textarea{min-width:0}
.ln{gap:12px}.ln span{min-width:0;overflow-wrap:anywhere}.ln b{flex-shrink:0}
.sw{max-width:100%}
@media(max-width:719px){
.tabs{gap:4px;padding:8px;scrollbar-width:none}.tabs button{padding:0 8px;font-size:14px}
main{padding:8px}.card{padding:10px}
.work-row{display:grid;grid-template-columns:minmax(0,1fr) 78px 58px 74px 32px;gap:4px}
.work-row .nm,.work-row select,.work-row .sm{width:100%;min-width:0}
.work-row input,.work-row select{padding:6px 4px;font-size:14px}
.work-row .pr{min-width:0;font-size:12px;margin:0}
.work-row .x{width:32px}
.work-row .ck{grid-column:1/-1;font-size:14px}
.ext-row{display:grid;grid-template-columns:24px minmax(0,1fr) 64px 80px 32px;gap:5px}
.ext-row .nm{grid-column:2/5;width:100%}
.ext-row .sm{width:100%}.ext-row .ck:nth-of-type(2){grid-column:1/3}
.ext-row .pr{grid-column:3/5;min-width:0}.ext-row .x{grid-column:5;grid-row:1;width:32px}
#sheet{width:100%;min-height:0;padding:16px;font-size:10pt;overflow-wrap:anywhere}
#sheet h1{font-size:19pt}#sheet td{font-size:9pt}#sheet .r{white-space:normal}
}
@media(max-width:360px){.work-row{grid-template-columns:minmax(0,1fr) 68px 48px 64px 28px}.work-row .x{width:28px}}
</style><link rel="stylesheet" href="/theme.css"></head>
<body><div id="app"></div>
<script>
const LIB={"Preprodukce":["Projektové řízení","Koncept, námět, moodboard","Scénář, Technický scénář, shotlist","Organizace natáčení"],"Produkce":["Režie","Natáčení","Focení","Osvětlovač","Zvuk","Produkční koordinace","Make-up, styling, hairstyling"],"Postprodukce":["Střih","Úprava barev, efekty","Úprava zvuku","Zpracování fotek","Grafika, animace"],"Další":["Grafika - thumbnail, SoMe post","Titulky","Nahrání na SoMe"]};
const FIXED=[];
const EXT=[["Licence hudba",500],["Záloha dat (1 rok)",200],["Technika",0],["Doprava",0],["Honorář herců",0],["Voiceover",0],["Kostýmy a rekvizity",0]];
const STEPS=[['basic','Základ'],['work','Procesy'],['ext','Externí'],['sum','Shrnutí'],['prev','Náhled']];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)&&n>0?n:0};
const fmt=x=>x.toLocaleString('cs-CZ',{maximumFractionDigits:2})+'\u00a0Kč';
const uid=()=>crypto.randomUUID();
const dcz=d=>{if(!d)return'';const a=d.split('-');return a.length===3?(+a[2])+'. '+(+a[1])+'. '+a[0]:d};
let S={projects:[],screen:'list',id:null,q:'',sort:'date'};
try{const a=JSON.parse(localStorage.getItem('qp1')||'[]');if(Array.isArray(a))S.projects=a.filter(p=>p&&p.id&&Array.isArray(p.items)&&Array.isArray(p.ext))}catch(e){}
function save(){try{localStorage.setItem('qp1',JSON.stringify(S.projects));if($('st'))$('st').textContent='Uloženo'}catch(e){if($('st'))$('st').textContent='Ukládání selhalo'}}
let SUP={rate:'750',sp:'6',fu:'45',rs:'40',hrate:'250',name:'Dominik Bednář',ico:'05728908',addr:'Příčná 633, 564 01 Žamberk',dic:'',email:'',phone:'',bank:'',terms:'V ceně jsou zahrnuta 3 kola korektur. Další korektury se účtují podle hodinové sazby.'};
try{Object.assign(SUP,JSON.parse(localStorage.getItem('qp1sup')||'{}'))}catch(e){}
const ST=['Rozpracováno','Odesláno','Přijato','Zamítnuto','Fakturováno'];
const statusKey=value=>['draft','sent','accepted','rejected','invoiced'][ST.indexOf(value)]||'draft';
S.projects.forEach(p=>{if(p.terms===undefined)p.terms=SUP.terms;if(!p.st)p.st=ST[0]});
const P=()=>S.projects.find(p=>p.id===S.id);
function mk(){const y=new Date().getFullYear();
const mx=Math.max(0,...S.projects.map(p=>String(p.no).startsWith(y+'-')?parseInt(String(p.no).slice(5))||0:0));
return{id:uid(),client:'',contact:'',email:'',phone:'',name:'',no:y+'-'+String(mx+1).padStart(3,'0'),date:new Date().toISOString().slice(0,10),valid:'',desc:'',out:'',notes:'',rate:SUP.rate||'750',supplier:structuredClone(SUP),tr:{km:'',sp:SUP.sp||'6',fu:SUP.fu||'45',rs:SUP.rs||'40',rent:'',hr:'',hrate:SUP.hrate||'250'},
items:Object.entries(LIB).flatMap(([c,a])=>a.map(n=>({id:uid(),cat:c,name:n,t:'h',v:'',on:true}))).concat(FIXED.map(n=>({id:uid(),cat:'Další služby',name:n,t:'f',v:'',on:false}))),
ext:EXT.map(([n,pr])=>({id:uid(),name:n,on:false,q:'1',pr:pr?String(pr):'',tbd:false})),res:'',disc:'',vatOn:false,vat:'21',st:'Rozpracováno',terms:SUP.terms,mod:Date.now()}}
function calc(p){const r=num(p.rate);let hours=0,hT=0,fT=0;const cats={};
p.items.forEach(i=>{const n=num(i.v);if(!(i.name.trim()&&n>0&&(i.t==='h'||i.on)))return;const v=i.t==='h'?n*r:n;if(i.t==='h'){hours+=n;hT+=v}else fT+=v;(cats[i.cat]=cats[i.cat]||{name:i.cat,rows:[],sum:0}).rows.push({n:i.name,v,h:i.t==='h'?n:0});cats[i.cat].sum+=v});
const ext=[];let eS=0;
p.ext.forEach(e=>{if(!e.on||!e.name.trim())return;if(e.tbd){ext.push({n:e.name,v:null});return}const v=num(e.q)*num(e.pr);if(v>0){ext.push({n:e.name,v});eS+=v}});
const base=hT+fT+eS,res=base*num(p.res)/100,s2=base+res,disc=s2*num(p.disc)/100,net=s2-disc,vat=net*(p.vat===''?0:num(p.vat))/100;
return{r,hours,hT,fT,cats:Object.values(cats),ext,eS,base,res,disc,net,vat,total:net+vat}}
function legacyHdr(p){return '<header class="np"><div>'+(p?'<b id="pn">'+esc(p.name||'Nový projekt')+'</b><br><small id="st">Uloženo</small>':'<b>Cenové nabídky</b>')+'</div>'+(p?'<div>Celkem <b id="gt"></b></div>':'')+'</header>'+
(p?'<nav class="tabs np"><button onclick="S.id=null;go(\'list\')">‹ Projekty</button>'+STEPS.map(s=>'<button class="'+(S.screen===s[0]?'pri':'')+'" onclick="go(\''+s[0]+'\')">'+s[1]+'</button>').join('')+'</nav>':'')}
function nav(){const i=STEPS.findIndex(s=>s[0]===S.screen);if(i<0)return'';
return '<div class="navb np">'+(i>0?'<button onclick="go(\''+STEPS[i-1][0]+'\')">‹ Zpět</button>':'<span></span>')+(i<4?'<button class="pri" onclick="go(\''+STEPS[i+1][0]+'\')">Pokračovat ›</button>':'<span></span>')+'</div>'}
function render(){if(window.cloudGate){window.showGate();return}const p=P();if(!p&&S.screen!=='set')S.screen='list';let b;
switch(S.screen){case'list':b=listH();break;case'basic':b=basic(p);break;case'work':b=work(p);break;case'ext':b=extH(p);break;case'sum':b=sum(p);break;case'set':b=setH();break;default:b=prev(p)}
$('app').innerHTML=hdr(S.screen==='list'?null:p)+'<main>'+statusH()+(S.screen==='work'?workIntro(p):'')+(p&&S.screen!=='set'&&S.screen!=='prev'?'<div class="workspace"><section>'+b+nav()+'</section><aside class="card summary np"><h3>Přehled nabídky</h3><div id="sideTotal"></div></aside></div>':b+nav())+'</main>';
if(S.screen==='list')lst();else upd()}
function go(s){S.screen=s;render();window.scrollTo(0,0)}
function openP(id){S.id=id;go('basic')}
function newP(){const p=mk();S.projects.push(p);save();openP(p.id)}
function dup(id){const s=S.projects.find(p=>p.id===id);if(!s)return;const c=JSON.parse(JSON.stringify(s));c.id=uid();c.st=ST[0];c.no=mk().no;c.mod=Date.now();S.projects.push(c);save();lst()}
function rm(id){if(!confirm('Přesunout nabídku do koše? Obnovit ji lze do 30 dní.'))return;const p=S.projects.find(p=>p.id===id);p.deletedAt=new Date().toISOString();p.mod=Date.now();save();lst()}
function listH(){return '<h1>'+ (S.trash?'Koš':'Vaše nabídky') +'</h1><p class="mu">'+(S.trash?'Nabídky lze obnovit do 30 dní od smazání.':'Od prvního nápadu k hotové cenové nabídce.')+'</p><div class="card"><div class="row"><input class="nm" placeholder="Hledat projekt nebo klienta" value="'+esc(S.q)+'" oninput="S.q=this.value;lst()"><select onchange="S.sort=this.value;lst()"><option value="date">Podle data</option><option value="name"'+(S.sort==='name'?' selected':'')+'>Podle názvu</option></select><button class="pri" onclick="newP()">+ Nový projekt</button><button onclick="go(\'set\')">Nastavení</button><button onclick="S.trash=!S.trash;render()">'+(S.trash?'Aktivní nabídky':'Koš')+'</button></div></div><div id="list" class="project-list"></div><p class="mu">Sdílené nabídky · automatické ukládání po přihlášení.</p>'}
function lst(){const q=S.q.toLowerCase();const a=S.projects.filter(p=>isTrashVisible(p)&&((p.name||'')+' '+(p.client||'')).toLowerCase().includes(q));
a.sort(S.sort==='name'?(x,y)=>(x.name||'').localeCompare(y.name||'','cs'):(x,y)=>y.mod-x.mod);
const sm=ST.map(s=>{const l=S.projects.filter(p=>!p.deletedAt&&(p.st||ST[0])===s);return l.length?s+': '+l.length+' · '+fmt(l.reduce((t,p)=>t+calc(p).total,0)):''}).filter(Boolean).join(' | ');
$('list').innerHTML=(sm?'<div class="mu" style="margin-bottom:8px">'+esc(sm)+'</div>':'')+(a.length?a.map(p=>p.deletedAt?trashCard(p):'<div class="card"><b>'+esc(p.name||'Bez názvu')+'</b> <span class="mu">'+esc(p.client)+'</span><div class="mu">č. '+esc(p.no)+' · upraveno '+new Date(p.mod).toLocaleDateString('cs-CZ')+'</div><div class="big">'+fmt(calc(p).total)+'</div><select aria-label="Stav nabídky" class="quote-status status-'+statusKey(p.st)+'" onchange="stl(\''+p.id+'\',this.value)">'+ST.map(s=>'<option'+((p.st||ST[0])===s?' selected':'')+'>'+s+'</option>').join('')+'</select><div class="row"><button class="pri" onclick="openP(\''+p.id+'\')">Otevřít</button><button onclick="dup(\''+p.id+'\')">Kopie</button><button onclick="rm(\''+p.id+'\')">Smazat</button></div></div>').join(''):'<div class="card mu">Zatím žádné projekty. Vytvoř první tlačítkem „Nový projekt“.</div>')}
function basic(p){const f=(l,k,t)=>'<label class="f">'+l+'<input '+(t||'type="text"')+' value="'+esc(p[k])+'" oninput="setp(\''+k+'\',this.value)"></label>';
const a=(l,k)=>'<label class="f">'+l+'<textarea rows="3" oninput="setp(\''+k+'\',this.value)">'+esc(p[k])+'</textarea></label>';
return '<div class="card"><label class="f"><b>Hodinová sazba (Kč/h)</b><input inputmode="decimal" value="'+esc(p.rate)+'" oninput="setp(\'rate\',this.value)"></label></div><div class="card">'+f('Klient / firma','client')+f('Kontaktní osoba','contact')+f('E-mail','email','type="email"')+f('Telefon','phone','type="tel"')+'</div><div class="card">'+f('Název projektu','name')+f('Číslo nabídky','no')+f('Datum vytvoření','date','type="date"')+f('Platnost nabídky do','valid','type="date"')+a('Popis projektu','desc')+a('Požadované výstupy','out')+a('Poznámky pro klienta','notes')+a('Podmínky nabídky (zobrazí se na konci)','terms')+'</div>'}
function setp(k,v){const p=P();p[k]=v;p.mod=Date.now();if(k==='name'&&$('pn'))$('pn').textContent=v||'Nový projekt';save();upd()}
function ed(l,id,k,v,re){const p=P();const o=p[l].find(x=>x.id===id);if(!o)return;o[k]=v;p.mod=Date.now();save();if(re)render();else upd()}
function del(l,id){const p=P();p[l]=p[l].filter(x=>x.id!==id);p.mod=Date.now();save();render()}
function addI(c){const p=P();p.items.push({id:uid(),cat:c,name:'',t:'h',v:'',on:true});p.mod=Date.now();save();render()}
function addE(){const p=P();p.ext.push({id:uid(),name:'',on:true,q:'1',pr:'',tbd:false});p.mod=Date.now();save();render()}
function trp(p){p.tr=Object.assign({km:'',sp:'6',fu:'45',rs:'40',rent:'',hr:'',hrate:'250'},p.tr||{});return p.tr}
function trc(p){const t=trp(p);return num(t.km)*num(t.sp)/100*num(t.fu)*(1+num(t.rs)/100)+num(t.rent)}
function sett(k,v){const p=P(),t=trp(p);t[k]=v;p.mod=Date.now();save();if($('trc'))$('trc').textContent=fmt(trc(p));if($('trt'))$('trt').textContent=fmt(trt(p))}
function trt(p){const t=trp(p);return num(t.hr)*num(t.hrate)}
function useTime(){const p=P(),t=trp(p);let e=p.items.find(x=>x.name.startsWith('Cestovní čas'));if(!e){e={id:uid(),cat:'Produkce',name:'',t:'f',v:'',on:true};p.items.push(e)}e.t='f';e.on=true;e.name='Cestovní čas ('+String(num(t.hr)).replace('.',',')+' h × '+Math.round(num(t.hrate))+' Kč)';e.v=String(Math.round(trt(p)));p.mod=Date.now();save();render()}
function useTr(){const p=P();let e=p.ext.find(x=>x.name==='Doprava');if(!e){e={id:uid(),name:'Doprava',on:true,q:'1',pr:'',tbd:false};p.ext.push(e)}if(e.on && num(e.pr)!==Math.round(trc(p)*100)/100 && !confirm('Aktualizovat stávající cenu dopravy podle kalkulačky?'))return;e.on=true;e.tbd=false;e.q='1';e.pr=String(Math.round(trc(p)*100)/100);p.mod=Date.now();save();render()}
function trH(p){const t=trp(p),f=(l,k)=>'<label class="f" style="flex:1 1 40%">'+l+'<input inputmode="decimal" value="'+esc(t[k])+'" oninput="sett(\''+k+'\',this.value)"></label>';
return '<div class="card"><h3>Kalkulačka dopravy</h3><div class="row">'+f('Najeto celkem, tam a zpět (km)','km')+f('Spotřeba l/100 km','sp')+f('Cena paliva Kč/l','fu')+f('Rezerva na palivo %','rs')+f('Půjčovné auta Kč','rent')+'</div><div class="ln"><span>Doprava (palivo s rezervou + půjčovné)</span><b id="trc">'+fmt(trc(p))+'</b></div><button onclick="useTr()">Použít jako Doprava</button><div class="row">'+f('Čas za volantem (h)','hr')+f('Sazba za řízení Kč/h','hrate')+'</div><div class="ln"><span>Cestovní čas</span><b id="trt">'+fmt(trt(p))+'</b></div><button onclick="useTime()">Přidat Cestovní čas do prací</button></div>'}
function isOn(p,c){const its=p.items.filter(i=>i.cat===c);const n=its.filter(i=>num(i.v)>0&&i.name.trim()&&(i.t==='h'||i.on)).length;S.op=S.op||{};return{its,n,o:S.op[p.id+':'+c]===undefined?true:S.op[p.id+':'+c]}}
function tg(c){const p=P();S.op=S.op||{};S.op[p.id+':'+c]=!isOn(p,c).o;render()}
function catH(c){const p=P(),x=isOn(p,c);return '<div class="card"><button class="category-head" style="width:100%;text-align:left" onclick="tg(\''+esc(c)+'\')"><b>'+(x.o?'▾ ':'▸ ')+esc(c)+'</b> <small>'+(x.n?x.n+' vyplněno':x.its.length+' položek')+'</small></button>'+(x.o?'<div class="work-labels"><span>Činnost</span><span>Typ</span><span>Hodiny / Kč</span><span>Cena</span><span></span></div>'+x.its.map(row).join('')+'<button onclick="addI(\''+esc(c)+'\')">+ Přidat položku</button>':'')+'</div>'}
function stl(id,v){const p=S.projects.find(x=>x.id===id);if(!p)return;p.st=v;p.mod=Date.now();save();lst()}
function sup(k,v){SUP[k]=v;save()}
function setH(){const f=(l,k,t)=>'<label class="f">'+l+'<input '+(t||'type="text"')+' value="'+esc(SUP[k])+'" oninput="sup(\''+k+'\',this.value)"></label>';
return '<div class="card"><h3>Dodavatel</h3>'+f('Jméno / firma','name')+f('IČO','ico')+f('DIČ (pokud jsi plátce DPH)','dic')+f('Adresa','addr')+f('E-mail','email','type="email"')+f('Telefon','phone','type="tel"')+f('Číslo účtu','bank')+f('Výchozí hodinová sazba Kč/h','rate')+f('Palivo Kč/l','fu')+f('Spotřeba l/100 km','sp')+f('Rezerva dopravy %','rs')+f('Sazba za řízení Kč/h','hrate')+'<label class="f">Výchozí podmínky nabídky<textarea rows="3" oninput="sup(\'terms\',this.value)">'+esc(SUP.terms)+'</textarea></label><p class="mu">Podmínky se při vytvoření nového projektu zkopírují do nabídky, kde je můžeš upravit.</p></div><button onclick="S.id=null;go(\'list\')">‹ Zpět na projekty</button>'}
function row(i){const e=(k,v,re)=>"ed('items','"+i.id+"','"+k+"',"+v+(re?',1':'')+")";
return '<div class="row work-row"><button class="name-open" title="'+esc(i.name)+'" onclick="editName(\''+i.id+'\')">'+esc(i.name||'Název činnosti')+'</button><input class="nm" aria-label="Název činnosti" value="'+esc(i.name)+'" placeholder="Název činnosti" oninput="'+e('name','this.value')+'"><select onchange="'+e('t','this.value',1)+'"><option value="h"'+(i.t==='h'?' selected':'')+'>Hodiny</option><option value="f"'+(i.t==='f'?' selected':'')+'>Pevná cena</option></select><input class="sm" inputmode="decimal" value="'+esc(i.v)+'" placeholder="'+(i.t==='h'?'hod':'Kč')+'" oninput="'+e('v','this.value')+'">'+(i.t==='f'?'<label class="ck"><input type="checkbox" '+(i.on?'checked':'')+' onchange="'+e('on','this.checked')+'">aktivní</label>':'')+'<b class="pr" id="r'+i.id+'"></b><button class="x" onclick="del(\'items\',\''+i.id+'\')">×</button></div>'}
function workIntro(p){return '<div class="work-intro"><h1>Procesy</h1><p class="mu">Vyplň hodiny u činností, které chceš nabídnout. Prázdné položky se v nabídce nezobrazí. Hodinové ceny se počítají ze sazby '+esc(p.rate)+' Kč/h.</p></div>'}
function work(p){const cats=[...new Set(p.items.map(i=>i.cat))];
return cats.map(catH).join('')+'<div class="card" id="wt"></div>'}
function extH(p){const e=(id,k,v,re)=>"ed('ext','"+id+"','"+k+"',"+v+(re?',1':'')+")";
return '<p class="mu">Zapni jen náklady, které chceš zahrnout. „Upřesnit“ zobrazí položku jako „Bude upřesněna“ bez započtení.</p><div class="card">'+p.ext.map(x=>'<div class="row ext-row"><label class="ck"><input type="checkbox" '+(x.on?'checked':'')+' onchange="'+e(x.id,'on','this.checked')+'"></label><input class="nm" value="'+esc(x.name)+'" placeholder="Název" oninput="'+e(x.id,'name','this.value')+'"><input class="sm" inputmode="decimal" value="'+esc(x.q)+'" placeholder="ks" oninput="'+e(x.id,'q','this.value')+'"><input class="sm" inputmode="decimal" value="'+esc(x.pr)+'" placeholder="Kč/ks" oninput="'+e(x.id,'pr','this.value')+'"><label class="ck"><input type="checkbox" '+(x.tbd?'checked':'')+' onchange="'+e(x.id,'tbd','this.checked')+'">upřesnit</label><b class="pr" id="r'+x.id+'"></b><button class="x" onclick="del(\'ext\',\''+x.id+'\')">×</button></div>').join('')+'<button onclick="addE()">+ Přidat náklad</button></div>'+trH(p)}
function sum(p){return '<div class="card"><div class="row"><label class="f" style="flex:1">Rezerva %<input inputmode="decimal" value="'+esc(p.res)+'" oninput="setp(\'res\',this.value)"></label><label class="f" style="flex:1">Sleva %<input inputmode="decimal" value="'+esc(p.disc)+'" oninput="setp(\'disc\',this.value)"></label></div><div class="row"><label class="f" style="flex:1">DPH %<input inputmode="decimal" value="'+esc(p.vat)+'" oninput="setp(\'vat\',this.value)"></label></div><p class="mu">Rezerva se počítá z mezisoučtu, sleva z mezisoučtu včetně rezervy a DPH z ceny po slevě. DPH se připočítává vždy.</p></div><div class="card" id="tot"></div>'}
const ln=(a,b,c)=>'<div class="ln '+(c||'')+'"><span>'+a+'</span><b>'+b+'</b></div>';
function totH(c){const p=P();let h=ln('Hodiny celkem',String(Math.round(c.hours*100)/100).replace('.',',')+' h')+ln('Hodinová práce',fmt(c.hT))+ln('Pevné ceny',fmt(c.fT))+'<hr>';
c.cats.forEach(x=>h+=ln(esc(x.name),fmt(x.sum)));h+=ln('Externí náklady',fmt(c.eS))+ln('Mezisoučet',fmt(c.base));
if(num(p.res))h+=ln('Rezerva '+esc(p.res)+' %',fmt(c.res));if(num(p.disc))h+=ln('Sleva '+esc(p.disc)+' %','−'+fmt(c.disc));
h+=ln('DPH '+esc(p.vat)+' %',fmt(c.vat));
return h+ln('Celkem vč. DPH',fmt(c.total),'t')}
function upd(){const p=P();if(!p)return;const c=calc(p);if($('sideTotal'))$('sideTotal').innerHTML=totH(c);if($('gt'))$('gt').textContent=fmt(c.total);
p.items.forEach(i=>{const e=$('r'+i.id);if(e)e.textContent=num(i.v)>0&&i.name.trim()&&(i.t==='h'||i.on)?fmt(i.t==='h'?num(i.v)*c.r:num(i.v)):'—'});
p.ext.forEach(x=>{const e=$('r'+x.id);if(e)e.textContent=!x.on?'—':x.tbd?'Bude upřesněna':fmt(num(x.q)*num(x.pr))});
if($('wt'))$('wt').innerHTML=ln('Hodiny celkem',String(Math.round(c.hours*100)/100).replace('.',',')+' h')+ln('Hodinová práce',fmt(c.hT))+ln('Celkem práce',fmt(c.hT+c.fT));if($('tot'))$('tot').innerHTML=totH(c)}
function sheet(p){const SUP=p.supplier||window.defaultSupplier,c=calc(p),lines=text=>esc(text).replace(/\n/g,'<br>');
let h='<h1>Cenová nabídka</h1><div class="quote-title">'+esc(p.name)+'</div><div class="quote-meta">Nabídka č. '+esc(p.no)+' · '+dcz(p.date)+(p.valid?' · platnost do '+dcz(p.valid):'')+'</div><div class="quote-parties"><div><small>Dodavatel</small><br><b>'+esc(SUP.name)+'</b><br>'+[SUP.addr,SUP.ico?'IČO: '+SUP.ico:'',SUP.dic?'DIČ: '+SUP.dic:'',SUP.email,SUP.phone].filter(Boolean).map(esc).join('<br>')+'</div><div><small>Odběratel</small><br>'+[p.client,p.contact,p.email,p.phone].filter(Boolean).map((x,i)=>i?esc(x):'<b>'+esc(x)+'</b>').join('<br>')+'</div></div>';
if(p.desc)h+='<p>'+lines(p.desc)+'</p>';if(p.out)h+='<p><b>Výstupy:</b> '+lines(p.out)+'</p>';
if(!c.cats.length&&!c.ext.length)h+='<p class="mu">Nabídka je zatím prázdná.</p>';
else{h+='<table class="quote-items"><thead><tr><th scope="col">Činnost</th><th scope="col" class="r">Cena bez DPH</th></tr></thead><tbody>';
c.cats.forEach(x=>h+='<tr><td><b>'+esc(x.name)+'</b><div class="quote-detail">('+x.rows.map(r=>esc(r.n)).join('; ')+')</div></td><td class="r">'+fmt(x.sum)+'</td></tr>');
if(c.ext.length)h+='<tr><td><b>Externí náklady</b><div class="quote-detail">('+c.ext.map(r=>esc(r.n)+' – '+(r.v==null?'bude upřesněna':fmt(r.v))).join('; ')+')</div></td><td class="r">'+fmt(c.eS)+'</td></tr>';
h+='</tbody></table>'}
let f='';const r=(a,b,k)=>'<tr'+(k?' class="tot"':'')+'><td>'+a+'</td><td class="r">'+b+'</td></tr>';
f+=r('Mezisoučet',fmt(c.base));if(num(p.res))f+=r('Rezerva '+esc(p.res)+' %',fmt(c.res));if(num(p.disc))f+=r('Sleva '+esc(p.disc)+' %','−'+fmt(c.disc));
f+=r('DPH '+esc(p.vat)+' %',fmt(c.vat))+r('Celkem vč. DPH',fmt(c.total),1);h+='<table class="quote-totals">'+f+'</table>';
if(p.notes)h+='<p class="quote-notes"><b>Poznámky:</b> '+lines(p.notes)+'</p>';if(p.terms)h+='<p class="quote-terms"><b>Podmínky:</b> '+lines(p.terms)+'</p>';if(SUP.bank)h+='<p class="quote-bank">Číslo účtu: '+esc(SUP.bank)+'</p>';return h}
function prev(p){return '<div class="card np">Pro PDF otevři tisk a zvol „Uložit jako PDF“. Na iPhonu: Sdílet → Tisk, pak dvěma prsty přibliž náhled a Sdílet → Uložit do Souborů.</div><p class="np"><button class="pri" onclick="window.print()">Tisk / uložit jako PDF</button></p><div class="sw"><div id="sheet">'+sheet(p)+'</div></div>'}
window.defaultSupplier=structuredClone(SUP);
</script><script src="/workspace.js"></script><script src="/cloud.js"></script></body></html>
